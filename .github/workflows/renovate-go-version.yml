name: Renovate Go version report

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: renovate-go-version-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report-go-version-change:
    if: >-
      ${{
        github.event.pull_request.user.type == 'Bot' &&
        startsWith(github.head_ref, 'renovate/') &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check Go version directives
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff -U0 "$base" "$HEAD_SHA" -- '*go.mod' '*go.work' ':(exclude)*vendor/*' |
            awk '/^\+\+\+ /{file=substr($2,3)} /^[-+](go|toolchain) /{if(file!=last){print "# " file; last=file} print}' \
            > "$RUNNER_TEMP/go-version-report.diff"

      - name: Replace Go version comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/go-version-report.diff`, 'utf8').trim();
            const marker = '<!-- renovate-go-version-directive-report -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const reportComments = comments.filter(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );

            for (const comment of reportComments) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: comment.id,
              });
            }

            if (report) {
              const body = [
                marker,
                'Renovate changed Go version directives in this PR:',
                '```diff\n' + report + '\n```',
                'Verify that build and release environments support the new Go version before merging.',
              ].join('\n\n');
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
